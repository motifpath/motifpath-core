services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motifpath
      POSTGRES_PASSWORD: motifpath
      POSTGRES_DB: core_domain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motifpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: motifpath
      MONGO_INITDB_ROOT_PASSWORD: motifpath
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: motifpath
      MINIO_ROOT_PASSWORD: motifpath
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the content-media bucket MediaService uploads into
  # (ADR-021), then exits. MinIO itself doesn't auto-create buckets — a real
  # S3 bucket in production is provisioned by motifpath-infra instead, read
  # through CloudFront rather than a public bucket policy. Public-read here
  # is a dev-only stand-in for that so object_url is fetchable without
  # signing, matching what MEDIA_PUBLIC_BASE_URL promises.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 motifpath motifpath &&
        mc mb --ignore-existing local/motifpath-content-media &&
        mc anonymous set download local/motifpath-content-media
      "

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  minio_data:
