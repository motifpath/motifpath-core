services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motifpath
      POSTGRES_PASSWORD: motifpath
      POSTGRES_DB: core_domain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motifpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: motifpath
      MONGO_INITDB_ROOT_PASSWORD: motifpath
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local stand-in for S3 (content media). SeaweedFS replaces MinIO, whose
  # public images were withdrawn from Docker Hub and quay.io in 2026. Same
  # port, credentials and bucket as before, so service .env files are
  # unchanged. Only the S3 API (9000) is published; SeaweedFS's master,
  # volume and filer ports stay inside the container.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -s3
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      # Browser uploads go straight to the presigned PUT URL, so the S3
      # gateway has to answer CORS itself. Dev-only: any origin.
      - -s3.allowedOrigins=*
    configs:
      - source: objectstore_s3
        target: /etc/seaweedfs/s3.json
    ports:
      - "9000:9000"   # S3 API
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the content-media bucket MediaService uploads into,
  # then exits. A real S3 bucket in production is provisioned by
  # motifpath-infra instead, read through a CDN rather than a public bucket
  # policy. Public-read here is a dev-only stand-in for that so object_url
  # is fetchable without signing, matching what MEDIA_PUBLIC_BASE_URL
  # promises.
  objectstore-init:
    image: amazon/aws-cli:2.37.9
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: motifpath
      AWS_SECRET_ACCESS_KEY: motifpath
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://objectstore:9000
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        B=motifpath-content-media
        # The port opens slightly before the gateway answers requests.
        n=0
        until aws s3api list-buckets >/dev/null 2>&1; do
          n=$$((n+1)); [ $$n -lt 30 ] || { echo "objectstore not answering" >&2; exit 1; }
          sleep 2
        done
        aws s3api head-bucket --bucket $$B 2>/dev/null || aws s3 mb s3://$$B
        aws s3api put-bucket-policy --bucket $$B --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::motifpath-content-media/*"}]}'

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --set redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  objectstore_data:

configs:
  # S3 identities for the local object store: one admin key pair (what the
  # services and objectstore-init use) and anonymous read on the media
  # bucket.
  objectstore_s3:
    content: |
      {
        "identities": [
          {
            "name": "motifpath",
            "credentials": [{ "accessKey": "motifpath", "secretKey": "motifpath" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          },
          {
            "name": "anonymous",
            "actions": ["Read:motifpath-content-media"]
          }
        ]
      }
