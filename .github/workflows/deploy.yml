name: Deploy

# Replaces one environment's containers on the VM with images already in ECR.
# Nothing is built here: production deploys the exact images staging ran, and
# a rollback is this workflow run again with an earlier release.
#
# - Staging deploys automatically after build-images.yml builds a `stage`
#   commit.
# - Production deploys a release: pushing a `vX.Y.Z` tag on `main` starts it
#   (and waits for the `production` environment's approval, if it has
#   reviewers). The tag usually sits on main's stage → main merge commit, which
#   has no images, so the images are those of the newest built commit the tag
#   contains: the `stage` commit staging ran, or a hotfix's own build. The
#   images get the release as an extra ECR tag, and a GitHub Release is
#   published with notes since the previous one.
# - Run by hand, `release` takes a tag (redeploy or roll back to it) or, in an
#   emergency, a full commit SHA. Blank deploys staging's newest build;
#   production always needs one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      release:
        description: Release tag (vX.Y.Z) or full commit SHA; blank = newest build on stage (staging only)
        type: string
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      release:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_ENV: ${{ inputs.environment || 'production' }}
  RELEASE: ${{ inputs.release || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  deploy:
    name: Deploy ${{ inputs.release || (github.ref_type == 'tag' && github.ref_name) || 'the newest build' }} to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      release: ${{ steps.choose.outputs.release }}
    steps:
      - name: Validate inputs
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          INSTANCE: ${{ vars.VM_INSTANCE_ID }}
        run: |
          [[ "$DEPLOY_ENV" =~ ^(staging|production)$ ]] || { echo "::error::unknown environment '$DEPLOY_ENV'"; exit 1; }
          [[ -z "$RELEASE" || "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::release must be a tag like v1.2.3 or a full 40-char commit SHA, got '$RELEASE'"; exit 1; }
          [[ "$DEPLOY_ENV" == staging || -n "$RELEASE" ]] || { echo "::error::production deploys a release: give a vX.Y.Z tag (or, in an emergency, a commit SHA)"; exit 1; }
          [[ -n "$KEY_ID" && -n "$INSTANCE" ]] || { echo "::error::GitHub environment '$DEPLOY_ENV' needs the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets and the VM_INSTANCE_ID variable; see deploy/README.md"; exit 1; }

      # For choosing the images and the branch check. The VM fetches the
      # deploy files for the chosen commit itself and repeats the check: this
      # key cannot send it anything but the SHA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          git fetch --quiet --tags origin
          git fetch --quiet origin main stage 2>/dev/null || git fetch --quiet origin main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # IMAGE_TAG is the commit whose images run. A release tag names the
      # commit it sits on; the images are those of the newest commit it
      # contains that was built in all three repositories.
      - name: Choose the images
        id: choose
        run: |
          set -euo pipefail
          newest_built() {
            local built commits
            built=$(for svc in core-domain event-ingestion aggregation-worker; do
                aws ecr describe-images --repository-name "motifpath/$svc" \
                  --query 'imageDetails[].imageTags[]' --output text | tr -s '[:space:]' '\n' |
                  { grep -E '^[0-9a-f]{40}$' || true; } | sort -u
              done | sort | uniq -c | awk '$1 == 3 { print $2 }')
            commits=$(git rev-list --max-count=500 "$1")
            awk 'NR == FNR { built[$1]; next } $1 in built { print $1; exit }' \
              <(printf '%s\n' "$built") <(printf '%s\n' "$commits")
          }
          tag=
          if [[ "$RELEASE" =~ ^v ]]; then
            tag=$RELEASE
            commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}") \
              || { echo "::error::no tag $tag in this repository"; exit 1; }
            if [[ "$DEPLOY_ENV" == production ]] && ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::$tag is not on main; tag the release on main after the stage → main merge"; exit 1
            fi
            IMAGE_TAG=$(newest_built "$commit")
            [[ -n "$IMAGE_TAG" ]] || { echo "::error::no commit in $tag has its three images in ECR"; exit 1; }
          elif [[ -n "$RELEASE" ]]; then
            IMAGE_TAG=$RELEASE
          else
            IMAGE_TAG=$(newest_built origin/stage)
            [[ -n "$IMAGE_TAG" ]] || { echo "::error::no commit on stage has its three images in ECR; run Build images first"; exit 1; }
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying ${tag:+$tag → }\`$IMAGE_TAG\` — $(git log -1 --format=%s "$IMAGE_TAG" 2>/dev/null || echo 'commit not on main or stage')"

      # Production only runs what has been promoted to main. Staging runs
      # release candidates from stage, or a hotfix already on main.
      - name: Check the commit is on a release branch
        run: |
          on() { git rev-parse --verify --quiet "origin/$1" >/dev/null && git merge-base --is-ancestor "$IMAGE_TAG" "origin/$1"; }
          if [[ "$DEPLOY_ENV" == production ]]; then
            on main || { echo "::error::$IMAGE_TAG is not on main; promote stage to main first"; exit 1; }
          else
            on stage || on main || { echo "::error::$IMAGE_TAG is on neither stage nor main"; exit 1; }
          fi

      - name: Check every image exists
        run: |
          for svc in core-domain event-ingestion aggregation-worker; do
            aws ecr describe-images --repository-name "motifpath/$svc" --image-ids imageTag="$IMAGE_TAG" >/dev/null \
              || { echo "::error::motifpath/$svc:$IMAGE_TAG is not in ECR; run Build images for this commit"; exit 1; }
          done

      # Image expiry in ECR never removes images carrying this tag to make
      # room for newer builds, so what production ran stays available for
      # redeploys and rollbacks.
      # A release also names its images: `vX.Y.Z` in ECR is the build that
      # release ran. Tags are immutable, so a release tag already on other
      # images (a moved git tag) fails here instead of being repointed.
      - name: Protect the images production runs
        if: env.DEPLOY_ENV == 'production'
        run: |
          set -euo pipefail
          for svc in core-domain event-ingestion aggregation-worker; do
            image=$(aws ecr batch-get-image --repository-name "motifpath/$svc" \
              --image-ids imageTag="$IMAGE_TAG" --query 'images[0]' --output json)
            for extra in "production-$IMAGE_TAG" ${RELEASE_TAG:+"$RELEASE_TAG"}; do
              out=$(aws ecr put-image --repository-name "motifpath/$svc" \
                --image-tag "$extra" \
                --image-manifest "$(jq -r .imageManifest <<<"$image")" \
                --image-manifest-media-type "$(jq -r .imageManifestMediaType <<<"$image")" 2>&1) \
                || grep -q ImageAlreadyExistsException <<<"$out" \
                || { echo "$out"; exit 1; }
            done
          done

      # The environment's deploy document is the only command this key may
      # send: it takes the SHA, checks it is on this environment's release
      # branches, and runs deploy/deploy.sh from that commit.
      - name: Run the deploy on the VM
        env:
          INSTANCE: ${{ vars.VM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "motifpath-$DEPLOY_ENV-deploy" \
            --comment "deploy $DEPLOY_ENV ${IMAGE_TAG:0:12}" \
            --parameters "imageTag=$IMAGE_TAG" \
            --query Command.CommandId --output text)
          echo "SSM command $id"

          while :; do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text)
          [[ -z "$err" || "$err" == None ]] || { echo "--- stderr ---"; echo "$err"; }

          [[ "$status" == Success ]] || { echo "::error::deploy finished with status $status"; exit 1; }
          echo "### Deployed ${RELEASE_TAG:+$RELEASE_TAG (}\`$IMAGE_TAG\`${RELEASE_TAG:+)} to $DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"

  # Published only once production runs the release, so the Releases page
  # lists what production actually ran.
  publish-release:
    name: Publish GitHub Release ${{ needs.deploy.outputs.release }}
    needs: deploy
    if: needs.deploy.outputs.release != '' && (inputs.environment || 'production') == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release, unless it already exists (a redeploy)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.release }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
