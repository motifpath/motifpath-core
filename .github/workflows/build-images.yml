name: Build images

# Release images are built only for commits meant to be deployed: every push
# to the release-candidate branch `stage`, and hotfix PRs merged straight
# into `main`. A normal stage → main promotion builds nothing; production
# runs the image staging already ran (see deploy.yml). Feature merges to
# `dev` never build.
#
# Pushing needs the ECR key in the GitHub environment `images`, which is
# limited to the `stage` and `main` branches; no other branch can publish an
# image.
on:
  push:
    branches: [stage, main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # A push to main is either a stage promotion or a merged hotfix; only the
  # hotfix needs an image. Decided by the branch of the PR that made the
  # commit.
  decide:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
          echo "main commit came from branch '${head:-unknown}'"
          if [[ "$head" == hotfix/* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.service }} (arm64)
    needs: decide
    if: needs.decide.outputs.build == 'true'
    # The VM is arm64; a native runner avoids building under emulation.
    runs-on: ubuntu-24.04-arm
    environment: images
    strategy:
      fail-fast: false
      matrix:
        service: [core-domain, event-ingestion, aggregation-worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Check AWS configuration
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          [[ -n "$KEY_ID" ]] || { echo "::error::GitHub environment 'images' has no AWS_ACCESS_KEY_ID secret; see deploy/README.md"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # An image already tagged with this commit was not built by this run,
      # and nothing proves who pushed it: someone holding the push key could
      # have published one ahead of the build. Fail loudly instead of
      # trusting it. To rebuild on purpose, delete the tag first
      # (aws ecr batch-delete-image) and re-run.
      - name: Refuse an existing tag
        env:
          REPO: motifpath/${{ matrix.service }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$REPO:$IMAGE_TAG already exists and was not pushed by this run; delete it to rebuild"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          # One plain image manifest per tag, which is all the VM pulls.
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/motifpath/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      release: ${{ github.sha }}
    secrets: inherit
