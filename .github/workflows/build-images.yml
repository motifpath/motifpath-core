name: Build images

# Release images are built only for commits meant to be deployed: every push
# to the release-candidate branch `stage`, and hotfix PRs merged straight
# into `main`. A normal stage → main promotion builds nothing; production
# runs the image staging already ran (see deploy.yml). Feature merges to
# `dev` never build.
#
# A push to main is also a release: once any build has finished, the merged
# PR's release label sets the next vX.Y.Z tag, the merge commit is tagged and
# that release is deployed to production.
#
# Pushing needs the ECR key in the GitHub environment `images`, which is
# limited to the `stage` and `main` branches; no other branch can publish an
# image.
on:
  push:
    branches: [stage, main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: us-east-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # A push to main is either a stage promotion or a merged hotfix; only the
  # hotfix needs an image. Decided by the branch of the PR that made the
  # commit.
  decide:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.ref // ""')
          echo "main commit came from branch '${head:-unknown}'"
          if [[ "$head" == hotfix/* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.service }} (arm64)
    needs: decide
    if: needs.decide.outputs.build == 'true'
    # The VM is arm64; a native runner avoids building under emulation.
    runs-on: ubuntu-24.04-arm
    environment: images
    strategy:
      fail-fast: false
      matrix:
        service: [core-domain, event-ingestion, aggregation-worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Check AWS configuration
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          [[ -n "$KEY_ID" ]] || { echo "::error::GitHub environment 'images' has no AWS_ACCESS_KEY_ID secret; see deploy/README.md"; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # An image already tagged with this commit was not built by this run,
      # and nothing proves who pushed it: someone holding the push key could
      # have published one ahead of the build. Fail loudly instead of
      # trusting it. To rebuild on purpose, delete the tag first
      # (aws ecr batch-delete-image) and re-run.
      - name: Refuse an existing tag
        env:
          REPO: motifpath/${{ matrix.service }}
        run: |
          if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::$REPO:$IMAGE_TAG already exists and was not pushed by this run; delete it to rebuild"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          # One plain image manifest per tag, which is all the VM pulls.
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/motifpath/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    uses: ./.github/workflows/deploy.yml
    # A called workflow's jobs get at most what the caller grants, and
    # deploy.yml declares a job (publishing a GitHub Release) that asks for
    # contents: write. It never runs for staging, and deploy.yml's own
    # top-level permissions keep the deploy job itself read-only.
    permissions:
      contents: write
    with:
      environment: staging
      release: ${{ github.sha }}
    secrets: inherit

  # The tag is created with the built-in token, so pushing it starts no other
  # workflow; the deploy is called from here. A merge without exactly one
  # release label stops here and deploys nothing.
  release:
    name: Tag the release
    needs: [decide, build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.decide.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the merge commit with the next version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags --force origin
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "$existing" ]]; then
            echo "$GITHUB_SHA is already release $existing (a rerun)."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          [[ -n "$pr" ]] || { echo "::error::$GITHUB_SHA did not come from a PR, so it has no release label; nothing is released"; exit 1; }
          mapfile -t labels < <(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '.[].name')
          if ! tag=$(scripts/next-release.sh "${labels[@]}" 2>&1); then
            echo "::error::PR #$pr: $tag; nothing is released"
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "PR #$pr releases $tag."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy to production
    needs: release
    uses: ./.github/workflows/deploy.yml
    # deploy.yml's GitHub Release job needs contents: write; see deploy-staging.
    permissions:
      contents: write
    with:
      environment: production
      release: ${{ needs.release.outputs.tag }}
    secrets: inherit
