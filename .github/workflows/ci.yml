name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --config=.golangci.yml ./...

  test:
    name: Unit Tests (service layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run service layer tests
        run: |
          go test ./services/.../internal/application/... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -v

      - name: Enforce coverage gate (80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out \
            | grep total \
            | awk '{print $3}' \
            | tr -d '%')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets the 80% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  test-bdd:
    name: BDD Tests (godog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Checkout specs (for feature files)
        uses: actions/checkout@v4
        with:
          repository: motifpath/motifpath-specs
          path: motifpath-specs

      - name: Run BDD tests
        run: go test -v -tags integration ./services/.../internal/bdd/...

  test-integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run integration tests
        run: go test -v -tags integration -timeout 120s ./services/.../internal/adapters/...

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, test-bdd, test-integration]
    steps:
      - run: echo "All CI checks passed"
