name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.27'
  GOLANGCI_LINT_VERSION: v2.14.0
  # internal/application packages, per module — the coverage-gated unit test set.
  APP_MODULES: >-
    ./services/core-domain/internal/application/...
    ./services/event-ingestion/internal/application/...
    ./services/aggregation-worker/internal/application/...

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run golangci-lint
        run: make lint

  test:
    name: Unit Tests (service layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum

      - name: Run service layer tests
        run: go test $APP_MODULES -coverprofile=coverage.out -covermode=atomic -v

      - name: Enforce coverage gate (80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below the 80% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets the 80% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  test-bdd:
    name: BDD Tests (godog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum

      - name: Checkout specs (for feature files)
        uses: actions/checkout@v4
        with:
          repository: motifpath/motifpath-specs
          path: _specs

      # The BDD tests resolve feature files relative to their own package
      # directory, expecting motifpath-specs as a sibling of this checkout —
      # the same layout as a local dev machine. actions/checkout can only
      # write inside the workspace, so relocate it here.
      - name: Position specs as a sibling checkout
        run: mv _specs "$(dirname "$GITHUB_WORKSPACE")/motifpath-specs"

      - name: Run BDD tests
        run: make test:bdd

  # The reference-data generators (scripts/) are where a catalog that breaks
  # its rules is refused before it becomes a frozen migration, so their tests
  # gate CI like the Go suites, against the specs catalogs they compile.
  # Production runs main's migrations, and Atlas never runs an applied
  # migration again: a branch may add migrations, never change or delete one
  # main already has.
  applied-migrations:
    name: Applied migrations unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the check
        run: prove scripts/applied-migrations.t

      - name: Fail if a migration on main changed
        run: scripts/applied-migrations.sh origin/main

  test-catalogs:
    name: Catalog generator tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout specs (for the catalogs)
        uses: actions/checkout@v4
        with:
          repository: motifpath/motifpath-specs
          path: _specs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run generator tests
        env:
          SPECS_DIR: ${{ github.workspace }}/_specs
        run: |
          for dir in scripts/diagram_catalog scripts/chord_catalog scripts/knowledge_map scripts/practice_drills scripts/progressions scripts/reference_data; do
            (cd "$dir" && python -m unittest -v) || exit 1
          done

  # The committed oapi-codegen stubs must be exactly what `make generate`
  # produces with the pinned toolchain against motifpath-specs main, so a
  # stub generated by a stray binary, or a spec change that never reached
  # the stubs, fails here instead of surfacing as a 950-line diff later.
  codegen:
    name: Generated stubs match specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout specs (for the OpenAPI contracts)
        uses: actions/checkout@v4
        with:
          repository: motifpath/motifpath-specs
          path: _specs

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      # mise.toml is the single source of truth for the oapi-codegen pin.
      - name: Install the pinned oapi-codegen
        run: |
          version=$(sed -n 's|^"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "\(.*\)"$|\1|p' mise.toml)
          test -n "$version" || { echo "oapi-codegen pin not found in mise.toml"; exit 1; }
          go install "github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v$version"

      - name: Test the bundle rewrite script
        run: prove scripts/openapi-compat.t

      - name: Regenerate the stubs
        run: make generate SPECS_DIR="$GITHUB_WORKSPACE/_specs"

      - name: Fail if the committed stubs drifted
        run: |
          git add --intent-to-add services/*/internal/adapters/http/generated
          if ! git diff --exit-code --stat -- services/*/internal/adapters/http/generated; then
            echo "::error::Generated stubs differ from 'make generate'. Run 'mise exec -- make generate' and commit the result."
            exit 1
          fi

  test-integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/*/go.sum
            go.work.sum

      - name: Run integration tests
        run: make test:int

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            images:
              - 'services/**'
              - '**/Dockerfile'
              - 'compose.images.yaml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'

  image-smoke:
    name: Release Image Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.images == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the service images
        run: docker compose -f compose.images.yaml build

      - name: Bring the stack up
        run: docker compose -f compose.images.yaml up --wait --wait-timeout 180

      # Proves the real image boots, applies migrations, and serves — not just
      # that `go run` works (ADR-016 §Decision.3). `--wait` only waits for the
      # containers to run (the images carry no healthcheck), and core-domain
      # applies every migration before it listens, so the probes retry until
      # each service answers instead of failing on the first connection reset.
      - name: Probe liveness and readiness
        run: |
          set -euo pipefail
          probe() { curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "$1" > /dev/null; }
          for port in 8080 8081 8082; do
            probe "localhost:$port/healthz"
            probe "localhost:$port/readyz"
            echo "port $port: /healthz + /readyz OK"
          done

      - name: Probe routing and auth middleware (expect 401)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/users/me)
          test "$code" = "401" || { echo "expected 401 from /users/me, got $code"; exit 1; }

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f compose.images.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.images.yaml down -v

  deploy-config:
    name: Deploy Config
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      # Stand-ins for what deploy.sh renders from SSM on the VM; enough to
      # prove every variable the compose files use is set by one file or the
      # other, so a missing one fails here instead of mid-deploy.
      - name: Render each environment's compose file
        run: |
          set -euo pipefail
          printf '%s\n' "DATABASE_URL='postgres://u:p@db:5432/x'" "MONGO_URI='mongodb://m'" \
            "CLERK_SECRET_KEY='sk_test_x'" "ECR_REGISTRY='123456789012.dkr.ecr.us-east-2.amazonaws.com'" \
            "MEDIA_S3_BUCKET='bucket'" "MEDIA_AWS_ACCESS_KEY_ID='AKIAEXAMPLE'" \
            "MEDIA_AWS_SECRET_ACCESS_KEY='secret'" "EMAIL_UNSUBSCRIBE_SECRET='secret'" > "$RUNNER_TEMP/secrets.env"
          for env in staging production; do
            IMAGE_TAG=0000000000000000000000000000000000000000 docker compose -p "$env" \
              --env-file "deploy/env/$env.env" --env-file "$RUNNER_TEMP/secrets.env" \
              -f deploy/compose.yaml config --quiet
            echo "$env: compose config OK"
          done
          ACME_EMAIL=ci@example.com AWS_REGION=us-east-2 docker compose -f deploy/edge/compose.yaml config --quiet

      - name: Validate the Caddyfile
        run: |
          image=$(sed -n 's/^ *image: *\(caddy:[^ ]*\)$/\1/p' deploy/edge/compose.yaml)
          docker run --rm -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/edge:/etc/caddy:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The edge must proxy to the same loopback ports the environments publish.
      - name: Check Caddyfile ports match the env files
        run: |
          set -euo pipefail
          for env in staging production; do
            for name in CORE_DOMAIN EVENT_INGESTION; do
              port=$(sed -n "s/^${name}_HOST_PORT=//p" "deploy/env/$env.env")
              grep -q "reverse_proxy 127.0.0.1:$port$" deploy/edge/Caddyfile \
                || { echo "Caddyfile has no reverse_proxy to $env ${name}_HOST_PORT=$port"; exit 1; }
            done
          done

      - name: ShellCheck deploy.sh
        run: shellcheck deploy/deploy.sh

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, test, test-bdd, test-catalogs, codegen, test-integration, changes, image-smoke, deploy-config]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          # image-smoke and deploy-config are path-filtered — "skipped" is an accepted result,
          # a real failure is not.
          [[ "${{ needs.changes.result }}"          == "success"             ]] || { echo "changes failed";          exit 1; }
          [[ "${{ needs.lint.result }}"             == "success"             ]] || { echo "lint failed";             exit 1; }
          [[ "${{ needs.test.result }}"             == "success"             ]] || { echo "test failed";             exit 1; }
          [[ "${{ needs.test-bdd.result }}"         == "success"             ]] || { echo "test-bdd failed";         exit 1; }
          [[ "${{ needs.test-catalogs.result }}"    == "success"             ]] || { echo "test-catalogs failed";    exit 1; }
          [[ "${{ needs.codegen.result }}"          == "success"             ]] || { echo "codegen failed";          exit 1; }
          [[ "${{ needs.test-integration.result }}" == "success"             ]] || { echo "test-integration failed"; exit 1; }
          [[ "${{ needs.image-smoke.result }}"      =~ ^(success|skipped)$   ]] || { echo "image-smoke failed";      exit 1; }
          [[ "${{ needs.deploy-config.result }}"    =~ ^(success|skipped)$   ]] || { echo "deploy-config failed";    exit 1; }
          echo "All required CI checks passed"
